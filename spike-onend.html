<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Spike: Howler onend with html5:true sprites</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
    #log { white-space: pre-wrap; font-size: 13px; line-height: 1.5; margin-top: 16px; }
    .event { color: #4fc3f7; }
    .time { color: #81c784; }
    .warn { color: #ffb74d; }
    .err { color: #e57373; }
    input, button { font-family: monospace; font-size: 14px; padding: 6px 10px; margin: 4px; }
    button { cursor: pointer; background: #333; color: #eee; border: 1px solid #555; }
    button:hover { background: #444; }
    label { display: block; margin: 8px 0 4px; }
  </style>
</head>
<body>
  <h2>Spike: Howler <code>onend</code> with <code>html5:true</code> + sprites</h2>
  <p>
    Tests whether <code>onend</code> fires at the sprite's <code>outPoint</code>
    (not only at the underlying file end) when using <code>html5: true</code>.
  </p>

  <label>Audio file path or URL:
    <input id="audioSrc" type="text" size="80"
           placeholder="file:///path/to/media/song.mp3  or  https://..." value="">
  </label>

  <label>inPoint (seconds): <input id="inPoint" type="number" value="1" step="0.1" min="0"></label>
  <label>outPoint (seconds): <input id="outPoint" type="number" value="5" step="0.1" min="0"></label>

  <button onclick="runSpike()">▶ Run Spike</button>
  <button onclick="stopSpike()">⏹ Stop</button>
  <button onclick="document.getElementById('log').textContent = ''">Clear Log</button>

  <div id="log"></div>

  <script>
    let howl = null;
    let seekPoll = null;

    function log(msg, cls) {
      const el = document.getElementById('log');
      const ts = performance.now().toFixed(1);
      el.innerHTML += `<span class="time">[${ts} ms]</span> <span class="${cls || ''}">${msg}</span>\n`;
      el.scrollTop = el.scrollHeight;
    }

    function runSpike() {
      if (howl) { howl.unload(); clearInterval(seekPoll); }

      const src = document.getElementById('audioSrc').value.trim();
      const inPt = parseFloat(document.getElementById('inPoint').value) || 0;
      const outPt = parseFloat(document.getElementById('outPoint').value) || 10;

      if (!src) { log('⚠ Enter an audio file path or URL first.', 'warn'); return; }

      const spriteMs = [inPt * 1000, (outPt - inPt) * 1000];
      log(`Creating Howl — src: ${src}`, 'event');
      log(`  html5: true, sprite "main": [${spriteMs}]`, 'event');
      log(`  inPoint=${inPt}s, outPoint=${outPt}s, trimmedDuration=${outPt - inPt}s`, 'event');

      howl = new Howl({
        src: [src],
        html5: true,
        sprite: { main: spriteMs },

        onload: () => {
          const dur = howl.duration();
          log(`onload — file duration: ${dur.toFixed(3)}s`, 'event');
          log(`Playing sprite "main"...`, 'event');
          howl.play('main');
        },
        onplay: () => {
          const t = performance.now();
          log(`onplay — seek: ${howl.seek().toFixed(3)}s`, 'event');

          // Poll seek() every 50ms to track position
          seekPoll = setInterval(() => {
            if (!howl || !howl.playing()) return;
            const s = howl.seek();
            // Log every 500ms
            if (Math.round(s * 2) % 1 === 0) {
              // just keep polling, we log milestones below
            }
          }, 50);
        },
        onpause: () => {
          log(`onpause — seek: ${howl.seek().toFixed(3)}s`, 'event');
        },
        onstop: () => {
          log(`onstop — seek: ${howl.seek().toFixed(3)}s`, 'event');
          clearInterval(seekPoll);
        },
        onend: () => {
          const seekPos = howl.seek();
          log(`⭐ onend — seek: ${seekPos.toFixed(3)}s`, 'event');
          log(`  Expected fire near outPoint=${outPt}s`, '');
          const delta = Math.abs(seekPos - outPt);
          if (delta < 0.1) {
            log(`  ✅ onend fired within ${(delta*1000).toFixed(0)}ms of outPoint — RELIABLE`, 'event');
          } else if (seekPos < inPt + 0.5) {
            log(`  ⚠ onend fired near 0 — likely at sprite end (Howler resets seek). Check file duration.`, 'warn');
            log(`  File duration: ${howl.duration().toFixed(3)}s. If this ≈ outPoint, onend is at file end.`, 'warn');
          } else {
            log(`  ⚠ onend fired ${(delta*1000).toFixed(0)}ms from outPoint (at seek=${seekPos.toFixed(3)}s)`, 'warn');
            log(`  May need fallback: setTimeout(stop, trimmedDuration*1000)`, 'warn');
          }
          clearInterval(seekPoll);
        },
        onloaderror: (id, err) => {
          log(`onloaderror: ${err}`, 'err');
        },
        onplayerror: (id, err) => {
          log(`onplayerror: ${err}`, 'err');
        }
      });
    }

    function stopSpike() {
      if (howl) {
        log('Manual stop', 'warn');
        howl.stop();
      }
    }
  </script>
</body>
</html>

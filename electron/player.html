<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-LivePlay Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #display {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #display img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #display canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="display"></div>

  <script>
    const display = document.getElementById('display');
    let pdfDoc = null;

    // F11 fullscreen toggle
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        window.playerAPI.requestToggleFullscreen();
      }
    });

    // Track fullscreen state for CSS
    window.playerAPI.onToggleFullscreen(() => {
      // Main process toggled fullscreen — update body class
      document.body.classList.toggle('fullscreen');
    });

    function showBlack() {
      display.innerHTML = '';
    }

    function showImage(mediaPath) {
      display.innerHTML = '';
      const img = document.createElement('img');
      // Use file:// protocol for local paths
      img.src = 'file://' + mediaPath;
      img.alt = '';
      img.draggable = false;
      img.onerror = () => {
        console.error('Failed to load image:', mediaPath);
        showBlack();
      };
      display.appendChild(img);
    }

    async function showPdf(mediaPath, page) {
      display.innerHTML = '';
      const pageNum = page || 1;

      try {
        // Load pdf.js from node_modules
        if (!window.pdfjsLib) {
          // pdf.js should be loaded via script tag or require
          console.error('pdf.js not loaded');
          showBlack();
          return;
        }

        const loadingTask = window.pdfjsLib.getDocument('file://' + mediaPath);
        pdfDoc = await loadingTask.promise;

        const pdfPage = await pdfDoc.getPage(pageNum);

        // Scale to fit the display area
        const displayRect = display.getBoundingClientRect();
        const unscaledViewport = pdfPage.getViewport({ scale: 1 });
        const scaleX = displayRect.width / unscaledViewport.width;
        const scaleY = displayRect.height / unscaledViewport.height;
        const scale = Math.min(scaleX, scaleY);

        const viewport = pdfPage.getViewport({ scale });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await pdfPage.render({ canvasContext: context, viewport }).promise;
        display.appendChild(canvas);
      } catch (error) {
        console.error('Failed to render PDF:', error);
        showBlack();
      }
    }

    // Listen for display state changes from main process
    window.playerAPI.onDisplayState((state) => {
      if (!state || state.type === 'black') {
        showBlack();
      } else if (state.type === 'image') {
        showImage(state.mediaPath);
      } else if (state.type === 'pdf') {
        showPdf(state.mediaPath, state.pdfPage);
      }
    });

    // Start in black state
    showBlack();
  </script>

  <!-- pdf.js loaded dynamically from node_modules -->
  <script>
    // Load pdf.js using path from preload
    (async function() {
      try {
        const pdfjsPath = window.playerAPI.getPdfjsPath();
        const workerPath = window.playerAPI.getPdfjsWorkerPath();
        const pdfjs = await import('file://' + pdfjsPath);
        window.pdfjsLib = pdfjs;
        pdfjs.GlobalWorkerOptions.workerSrc = 'file://' + workerPath;
        console.log('pdf.js loaded successfully');
      } catch (err) {
        console.warn('pdf.js not available:', err.message);
      }
    })();
  </script>
</body>
</html>

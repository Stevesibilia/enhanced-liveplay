<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-LivePlay Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }
    #display {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .layer {
      position: absolute;
      overflow: hidden;
    }
    .layer img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <div id="display"></div>

  <script>
    const display = document.getElementById('display');

    // F11 fullscreen toggle
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        window.playerAPI.requestToggleFullscreen();
      }
    });

    // Track fullscreen state for CSS
    window.playerAPI.onToggleFullscreen(() => {
      document.body.classList.toggle('fullscreen');
    });

    function mediaUrl(absolutePath) {
      return 'local-media://' + encodeURIComponent(absolutePath).replace(/%2F/g, '/');
    }

    function clearDisplay() {
      display.innerHTML = '';
    }

    function makeImageLayer(layer) {
      const el = document.createElement('div');
      el.className = 'layer';
      el.dataset.layerId = layer.id;
      el.style.left = layer.x + '%';
      el.style.top = layer.y + '%';
      el.style.width = layer.width + '%';
      el.style.height = layer.height + '%';
      el.style.zIndex = String(layer.zIndex);

      const img = document.createElement('img');
      img.src = mediaUrl(layer.mediaPath);
      img.alt = '';
      img.draggable = false;
      img.onerror = () => {
        // Fallback to file:// if local-media protocol fails
        img.onerror = null;
        img.src = 'file://' + layer.mediaPath;
      };
      el.appendChild(img);
      return el;
    }

    function renderState(state) {
      console.log('[Player] Received display state:', state);

      // Backwards compatibility: legacy single-item payload (image only — PDF deferred)
      if (state && typeof state.type === 'string') {
        clearDisplay();
        if (state.type !== 'image' || !state.mediaPath) return;
        const synthetic = {
          id: 'legacy',
          type: 'image',
          mediaPath: state.mediaPath,
          x: 0, y: 0, width: 100, height: 100, zIndex: 1,
        };
        state = { layers: [synthetic] };
      }

      clearDisplay();

      const layers = Array.isArray(state?.layers) ? state.layers : [];
      if (layers.length === 0) return;

      const sorted = [...layers].sort((a, b) => a.zIndex - b.zIndex);
      for (const layer of sorted) {
        if (layer.type === 'image') {
          display.appendChild(makeImageLayer(layer));
        }
        // Other types are ignored for now.
      }
    }

    window.playerAPI.onDisplayState(renderState);

    // Start in black state
    clearDisplay();
  </script>
</body>
</html>
